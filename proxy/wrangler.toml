# LEONIDA private GPT Worker. Safe to commit: this file contains NO secrets.
# The pilot starts DISABLED because AI_ENABLED is not set by default.
# Set AI_ENABLED in the Cloudflare Dashboard only after secrets and billing controls are verified.
# keep_vars ensures dashboard variables persist on subsequent Wrangler deployments.
name = "leonida-gpt-private"
main = "./openai-worker.ts"
compatibility_date = "2026-11-01"
keep_vars = true
preview_urls = false

[vars]
MODEL = "gpt-6.1-terra"
ALLOWED_ORIGIN = "https://teoselimo.github.io"
MONTHLY_BUDGET_USD = "2.00"
MAX_CALLS_PER_MONTH = "400"
MAX_CALLS_PER_MINUTE = "6"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]

# Secrets (NEVER commit their values):
# npx wrangler secret put OPENAI_API_KEY -c proxy/wrangler.toml
# npx wrangler secret put LEONIDA_ACCESS_TOKEN -c proxy/wrangler.toml
