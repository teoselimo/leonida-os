<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a1452"/>
      <stop offset="0.55" stop-color="#1c0b2c"/>
      <stop offset="1" stop-color="#0b0613"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.5" stop-color="#ff5a8a"/>
      <stop offset="1" stop-color="#c13cff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3f0"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="512" cy="488" r="340"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="488" r="340" fill="#ff4f93" opacity="0.35" filter="url(#glow)"/>
  <g clip-path="url(#sunclip)">
    <rect x="160" y="140" width="704" height="700" fill="url(#sun)"/>
    <!-- bandes de coucher de soleil -->
    <rect x="160" y="590" width="704" height="22" fill="#1c0b2c"/>
    <rect x="160" y="646" width="704" height="30" fill="#1c0b2c"/>
    <rect x="160" y="712" width="704" height="40" fill="#1c0b2c"/>
    <rect x="160" y="786" width="704" height="70" fill="#1c0b2c"/>
  </g>
  <!-- L : un tracé de route qui devient l'initiale, avec un point de destination (copilote) -->
  <path d="M408 290 V636 Q408 700 472 700 H586" fill="none" stroke="url(#road)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="690" cy="700" r="62" fill="#ffffff"/>
  <circle cx="690" cy="700" r="26" fill="#ff4f93"/>
</svg>
