name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ["collector/**", "docs/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (le flux est lu en direct ; inutile de reconstruire le site à chaque collecte)
        env:
          NEXT_PUBLIC_RADAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/radar.json
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      # Construire la preversion GPT de la branche experimentale dans un dossier dedie.
      # AUCUN changement de code ni de variables sur la version publique a la racine.
      - name: Recuperer LEONIDA GPT (branche de test seulement)
        uses: actions/checkout@v4
        with:
          # Version GPT explicitement épinglée, jamais la branche main.
          ref: 3fb8a7d792ba88787cb5f82c4d566ac843c66a28
          path: gpt-preview-src
          persist-credentials: false
      - name: Installer les dependances de la preversion
        working-directory: gpt-preview-src
        run: npm ci --no-audit --no-fund
      - name: Construire la preversion GPT, sans secrets navigateur
        working-directory: gpt-preview-src
        env:
          NEXT_PUBLIC_RADAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/radar.json
          NEXT_PUBLIC_GPT_ENABLED: "1"
          NEXT_PUBLIC_GPT_PROXY_URL: https://leonida-gpt-private.spitfier9.workers.dev/v1/chat
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Ajouter la preversion en /gpt-preview/ (racine publique conservee)
        run: |
          test -s out/index.html
          test -s gpt-preview-src/out/index.html
          mkdir -p out/gpt-preview
          cp -a gpt-preview-src/out/. out/gpt-preview/
          test -s out/gpt-preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
