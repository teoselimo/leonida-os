name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cd collector && npm ci --no-audit --no-fund && npm run typecheck && npm test
      # Chrome est préinstallé sur les runners Ubuntu ; WebKit (moteur de Safari) est installé pour les parcours V0.7.1
      - run: npx playwright install --with-deps webkit
      - run: npm run test:all
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          CHROME_PATH: /usr/bin/google-chrome
