name: Veille Radar (collecte)

# Exécution côté serveur, même quand personne n'a l'app ouverte.
# GitHub ne garantit pas la ponctualité du cron (retards possibles aux heures chargées).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Interroger toutes les sources maintenant (diagnostic)"
        type: boolean
        default: true
      only:
        description: "Limiter à certaines sources (ids séparés par des virgules)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Dépendances du collecteur
        working-directory: collector
        run: npm ci --no-audit --no-fund

      - name: Tests du pipeline
        working-directory: collector
        run: npm test

      - name: Préparer la branche data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REMOTE" data-branch
          else
            mkdir data-branch && cd data-branch && git init -b data && git remote add origin "$REMOTE"
          fi

      - name: Collecte, tri, analyse, validation
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DAILY_UNITS: ${{ vars.YOUTUBE_DAILY_UNITS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DEEP_READ_MAX: ${{ vars.DEEP_READ_MAX }}
        run: |
          ARGS="--data ../data-branch"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          set -o pipefail
          npx tsx src/cli.ts $ARGS | tee ../collect.log
          echo "### Collecte $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat ../collect.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le flux (branche data, sans redéployer le site)
        working-directory: data-branch
        run: |
          git config user.name "leonida-veille"
          git config user.email "leonida-veille@users.noreply.github.com"
          printf '# Données LEONIDA OS\n\nBranche écrite automatiquement par le workflow « Veille Radar ». radar.json est lu par l application.\n' > README.md
          git add -A
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -q -m "Radar : collecte du $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push origin HEAD:data && exit 0; sleep $((i*5)); git pull --rebase origin data || true; done
          exit 1
